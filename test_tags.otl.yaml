- name: tag_test_1
  rule: raw_bash
  tags:
    - foo
  rule_args:
    cmds:
      - "tags: foo"
- name: tag_test_2
  rule: raw_bash
  tags:
    - bar
  rule_args:
    cmds:
      - "tags: bar"
- name: tag_test_3
  rule: raw_bash
  tags:
    - foo
    - bar
  rule_args:
    cmds:
      - "tags: foo,bar"
- name: tag_test_4
  rule: raw_bash
  tags: []
  rule_args:
    cmds:
      - "tags: none"
